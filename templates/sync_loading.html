<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncing - FAST Timetable Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0f;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #1a1a24;
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid #2d2d3a;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #f1f5f9;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-left-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 1rem;
        }
        .btn:hover {
            background: #818cf8;
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="spinner"></div>
        <h1 id="status-title">Syncing your calendar...</h1>
        <p id="status-desc">We are securely communicating with Google. This may take up to 15 seconds depending on how many courses you have selected. Please don't close this window.</p>
    </div>

    <script>
        const payload = {{ courses_json|safe }};
        fetch('/api/user/courses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ courses: payload })
        })
            .then(res => {
                if (res.ok) {
                    return res.json();
                } else {
                    return res.text().then(text => { throw new Error("The server encountered an error while communicating with Google."); });
                }
            })
            .then(data => {
                if (data.success) {
                    window.location.href = '/sync-success';
                } else {
                    throw new Error(data.error || "Unknown error occurred.");
                }
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `
                    <div class="icon">❌</div>
                    <h1 style="color: #ef4444;">Sync Failed</h1>
                    <p>${err.message}</p>
                    <a href="/" class="btn">Back to Generator</a>
                `;
            });
    </script>
</body>
</html>
